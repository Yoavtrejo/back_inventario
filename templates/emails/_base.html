<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #EDF2F7;
        }
        .header {
            background: linear-gradient(135deg, #F97316, #E53E6D);
            padding: 30px 20px;
            text-align: center;
            color: #FFFFFF;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 30px 25px;
            color: #334155;
        }
        .content p {
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .info-box {
            background-color: #FFF7ED;
            border-left: 4px solid #F97316;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .info-item {
            margin: 8px 0;
            font-size: 14px;
        }
        .info-item strong {
            color: #475569;
        }
        .highlight {
            font-size: 28px;
            font-weight: 700;
            color: #E53E6D;
            text-align: center;
            margin: 10px 0 20px;
        }
        .note {
            font-size: 14px;
            color: #9A3412;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #F97316, #E53E6D);
            color: #FFFFFF !important;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0px 4px 15px rgba(229, 62, 109, 0.25);
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>SIDERED</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
            {% block button %}
            <div class="btn-container">
                <a href="{{ activities_url }}" class="btn">Ver mis actividades</a>
            </div>
            {% endblock %}
        </div>
        <div class="footer">
            Este es un correo automático de SIDERED, por favor no respondas a este mensaje.
        </div>
    </div>
</body>
</html>
